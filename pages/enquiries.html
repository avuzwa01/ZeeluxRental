<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Rentals</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">HOME</a>
            <a href="./about-us.html">ABOUT US</a>
            <a href="./contact.html">CONTACT US</a>
            <a href="./enquiries.html">ENQUIRY</a>
            <a href="./services.html">SERVICES</a>
        </nav>
    </header>
    <main>
        <section class="page-header">
            <h1>Enquiry Form</h1>
            <p>Looking for the perfect dress? Send us an enquiry and we will assist you.</p>
        </section>

                <section class="enquiry-section">
    <h2>Make an Enquiry</h2>
    <p>Fill out this form to check availability and get a quote for your special occasion.</p>

    <!-- 
      Replace 'YOUR_FORM_ID' with the ID you get from Formspree 
      (See Step 3 below on how to get this) 
    -->
    <form action="https://formspree.io/f/xaeqbwnd" method="POST">
        
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <label for="phone">Contact Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your contact number" required>

        <label for="occasion">Occasion</label>
        <select id="occasion" name="occasion" required>
            <option value="">Select an occasion</option>
            <option value="Matric Dance">Matric Dance</option>
            <option value="Graduation">Graduation</option>
            <option value="Birthday">Birthday</option>
            <option value="Formal Event">Formal Event</option>
            <option value="Special Occasion">Special Occasion</option>
        </select>

        <label for="event-date">Event Date</label>
        <input type="date" id="event-date" name="event-date" required>

        <label for="dress-size">Dress Size</label>
        <select id="dress-size" name="dress-size" required>
            <option value="">Select your size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
        </select>

        <label for="colour">Preferred Colour</label>
        <input type="text" id="colour" name="colour" placeholder="e.g. Black, Gold, Pink">

        <label for="message">Additional Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us what type of dress you are looking for..."></textarea>

        <button type="submit">Submit Enquiry</button>
    </form>

        </section>
    </main>
    <footer>
        <p>zeeluxrental&copy; 2026. All Rights Reserved.</p>
    </footer>
</body>
</html>
